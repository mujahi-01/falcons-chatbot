<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA API Key Tester & Auto Model Checker</title>
    <style>
        :root {
            --stone-50: #faf7f2;
            --stone-100: #f5f0e8;
            --stone-200: #ede4d6;
            --stone-300: #e0d5c3;
            --stone-400: #c9b99d;
            --stone-500: #b8a081;
            --stone-600: #9c8062;
            --stone-700: #7d654c;
            --stone-800: #5c4a3a;
            --stone-900: #3d3228;
            --amber-100: #fef3e4;
            --amber-200: #fde6c8;
            --amber-300: #fbd094;
            --amber-400: #f5b85c;
            --amber-500: #e89e3a;
            --amber-600: #c97d24;
            --rose-100: #fef0ed;
            --rose-200: #fdd9d3;
            --rose-400: #f08b7a;
            --emerald-400: #5db89a;
            --emerald-500: #3d9e7c;
            --glass-bg: rgba(255,255,255,0.52);
            --glass-bg-strong: rgba(255,255,255,0.68);
            --glass-bg-light: rgba(255,255,255,0.35);
            --glass-border: rgba(255,255,255,0.45);
            --glass-border-strong: rgba(255,255,255,0.7);
            --glass-shadow: 0 8px 40px rgba(61,50,40,0.10);
            --glass-shadow-lg: 0 20px 60px rgba(61,50,40,0.13);
            --blur-amount: 18px;
            --blur-amount-heavy: 28px;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-smooth: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
            background:
                radial-gradient(ellipse at 15% 10%, #fdf6ed 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, #f3e9d8 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, #faf5ec 0%, #ede1cf 40%, #e8d9c4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content:'';
            position:fixed; inset:0;
            pointer-events:none; z-index:0; opacity:0.06;
            background-image:
                repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(120,90,60,0.12) 2px,rgba(120,90,60,0.12) 3px),
                repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(120,90,60,0.08) 2px,rgba(120,90,60,0.08) 3px);
        }
        .decorative-orb {
            position:fixed; border-radius:50%; pointer-events:none; z-index:0;
            filter:blur(80px); opacity:0.35; animation:orbFloat 16s ease-in-out infinite;
        }
        .decorative-orb.orb-1 { width:320px;height:320px;background:#f5d5b8;top:-80px;left:-60px; }
        .decorative-orb.orb-2 { width:260px;height:260px;background:#e8ceb0;bottom:-60px;right:-40px;animation-delay:-7s;animation-duration:18s; }
        .decorative-orb.orb-3 { width:200px;height:200px;background:#f0ddd0;top:50%;left:55%;animation-delay:-4s;animation-duration:20s; }
        @keyframes orbFloat {
            0%,100%{transform:translate(0,0) scale(1);}
            25%{transform:translate(30px,-40px) scale(1.12);}
            50%{transform:translate(-20px,20px) scale(0.94);}
            75%{transform:translate(-35px,-15px) scale(1.06);}
        }
        .main-container {
            position:relative; z-index:1; width:100%; max-width:820px;
            background:var(--glass-bg);
            backdrop-filter:blur(var(--blur-amount));
            -webkit-backdrop-filter:blur(var(--blur-amount));
            border:1.5px solid var(--glass-border);
            border-radius:var(--radius-xl);
            box-shadow:var(--glass-shadow-lg);
            padding:36px 32px 32px;
            transition:all var(--transition-smooth);
        }
        .main-container::before {
            content:''; position:absolute; inset:-2px;
            border-radius:calc(var(--radius-xl) + 2px); padding:2px;
            background:linear-gradient(135deg,rgba(200,160,110,0.35),rgba(220,190,150,0.2),rgba(180,140,100,0.3),rgba(210,175,135,0.25),rgba(195,155,115,0.35));
            background-size:400% 400%; animation:borderGlow 8s ease-in-out infinite;
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude;
            pointer-events:none; z-index:-1;
        }
        @keyframes borderGlow {
            0%,100%{background-position:0% 50%;}
            25%{background-position:100% 0%;}
            50%{background-position:100% 100%;}
            75%{background-position:0% 100%;}
        }
        .header { text-align:center; margin-bottom:24px; }
        .header .icon-row { display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px; }
        .header .nvidia-logo {
            width:36px;height:36px;
            background:linear-gradient(135deg,#76b900,#5a9e00);
            border-radius:10px; display:flex;align-items:center;justify-content:center;
            color:#fff; font-weight:900; font-size:18px; letter-spacing:-1px;
            box-shadow:0 4px 14px rgba(118,185,0,0.3);
        }
        .header h1 { font-size:1.75rem;font-weight:700;color:var(--stone-900);letter-spacing:-0.3px; }
        .header .subtitle { font-size:0.9rem;color:var(--stone-600);font-weight:500; }

        /* Backend badge */
        .backend-badge {
            display:inline-flex;align-items:center;gap:5px;
            background:rgba(118,185,0,0.12);border:1px solid rgba(118,185,0,0.3);
            border-radius:20px;padding:4px 10px;font-size:0.75rem;font-weight:600;
            color:#4a7a00;margin-top:6px;
        }

        .form-section { margin-bottom:18px; }
        .form-label {
            display:flex;align-items:center;gap:7px;
            font-weight:650;font-size:0.9rem;color:var(--stone-800);margin-bottom:7px;
        }
        .form-label .label-icon { width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px; }
        .input-row { display:flex;gap:10px;align-items:stretch;flex-wrap:wrap; }
        .input-row .input-wrapper { flex:1;position:relative; }
        .glass-input, .glass-textarea {
            width:100%;padding:13px 16px;
            background:var(--glass-bg-light);
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            border:1.5px solid var(--glass-border);
            border-radius:var(--radius-md);
            font-size:0.95rem;
            font-family:'SF Mono','Cascadia Code','Consolas','Monaco',monospace;
            color:var(--stone-900);transition:all var(--transition-smooth);outline:none;
        }
        .glass-input::placeholder,.glass-textarea::placeholder {
            color:var(--stone-400);font-family:'Segoe UI','Inter',system-ui,sans-serif;
        }
        .glass-input:focus,.glass-textarea:focus {
            border-color:var(--amber-400);
            background:rgba(255,255,255,0.6);
            box-shadow:0 0 0 5px rgba(200,150,90,0.08),0 4px 20px rgba(0,0,0,0.05);
        }
        .glass-textarea { resize:vertical;min-height:90px;font-family:'Segoe UI','Inter',system-ui,sans-serif;line-height:1.5; }
        .btn {
            display:inline-flex;align-items:center;justify-content:center;gap:7px;
            padding:12px 20px;border-radius:var(--radius-sm);
            font-weight:600;font-size:0.9rem;cursor:pointer;border:none;
            transition:all var(--transition-smooth);letter-spacing:0.2px;
            white-space:nowrap;font-family:'Segoe UI','Inter',system-ui,sans-serif;
        }
        .btn:active { transform:scale(0.97); }
        .btn:disabled { opacity:0.5;cursor:not-allowed;transform:none; }
        .btn-glass {
            background:var(--glass-bg-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border:1.5px solid var(--glass-border-strong);color:var(--stone-800);
            box-shadow:0 2px 12px rgba(0,0,0,0.05);
        }
        .btn-glass:hover:not(:disabled) { background:rgba(255,255,255,0.8);border-color:var(--stone-300);box-shadow:0 4px 20px rgba(0,0,0,0.09);transform:translateY(-1px); }
        .btn-primary { background:linear-gradient(135deg,#c98d4e,#b8783a);color:#fff;border:1.5px solid rgba(255,255,255,0.3);box-shadow:0 4px 18px rgba(180,120,55,0.3); }
        .btn-primary:hover:not(:disabled) { background:linear-gradient(135deg,#d49a5c,#c58545);box-shadow:0 6px 24px rgba(180,120,55,0.4);transform:translateY(-2px); }
        .btn-emerald { background:linear-gradient(135deg,#5db89a,#3d9e7c);color:#fff;border:1.5px solid rgba(255,255,255,0.3);box-shadow:0 4px 18px rgba(61,158,124,0.3); }
        .btn-emerald:hover:not(:disabled) { background:linear-gradient(135deg,#6cc8a8,#4aaf8c);box-shadow:0 6px 24px rgba(61,158,124,0.4);transform:translateY(-2px); }
        .btn-warning { background:linear-gradient(135deg,#e8a840,#d18b2c);color:#fff;border:1.5px solid rgba(255,255,255,0.3);box-shadow:0 4px 18px rgba(200,120,40,0.3); }
        .btn-warning:hover:not(:disabled) { background:linear-gradient(135deg,#f0b850,#dc9838);box-shadow:0 6px 24px rgba(200,120,40,0.4);transform:translateY(-2px); }
        .btn-danger { background:linear-gradient(135deg,#e05545,#c43a2a);color:#fff;border:1.5px solid rgba(255,255,255,0.3);box-shadow:0 4px 18px rgba(200,60,50,0.3); }
        .btn-danger:hover:not(:disabled) { background:linear-gradient(135deg,#ec6655,#d44535);transform:translateY(-2px); }
        .btn-sm { padding:9px 15px;font-size:0.82rem;border-radius:7px; }
        .status-row { display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap; }
        .status-badge {
            display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
            border-radius:20px;font-size:0.82rem;font-weight:600;
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            transition:all 0.4s ease;
        }
        .status-badge.checking { background:rgba(255,240,210,0.7);border:1.5px solid rgba(230,180,80,0.5);color:#8a6d30; }
        .status-badge.success  { background:rgba(220,250,230,0.7);border:1.5px solid rgba(100,200,140,0.5);color:#2d6b45; }
        .status-badge.warning  { background:rgba(255,240,210,0.7);border:1.5px solid rgba(230,180,80,0.5);color:#8a6d30; }
        .status-badge.error    { background:rgba(255,225,220,0.7);border:1.5px solid rgba(240,120,100,0.5);color:#8b3a30; }
        .status-dot { width:9px;height:9px;border-radius:50%;display:inline-block;animation:pulse 1.8s ease-in-out infinite; }
        .status-dot.dot-checking { background:#e8a830;animation-duration:0.8s; }
        .status-dot.dot-success  { background:#3d9e7c;animation:none; }
        .status-dot.dot-warning  { background:#e8a830;animation:none; }
        .status-dot.dot-error    { background:#e05545;animation:none; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);} }

        .response-area {
            margin-top:20px;padding:18px 20px;
            background:var(--glass-bg-light);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border:1.5px solid var(--glass-border);
            border-radius:var(--radius-md);
            min-height:60px;max-height:520px;overflow-y:auto;
            font-size:0.88rem;color:var(--stone-800);line-height:1.6;
            white-space:pre-wrap;word-break:break-word;
            transition:all var(--transition-smooth);display:none;
        }
        .response-area.visible { display:block;animation:fadeSlideIn 0.4s ease-out; }
        .response-meta { font-size:0.75rem;color:var(--stone-500);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }

        /* Log panel */
        .log-panel {
            margin-top:12px;
            background:rgba(30,25,20,0.88);
            border-radius:var(--radius-sm);
            padding:14px 16px;
            font-family:'SF Mono','Cascadia Code','Consolas',monospace;
            font-size:0.78rem;line-height:1.7;
            color:#c8bfb0;
            max-height:260px;overflow-y:auto;
        }
        .log-line { display:block; }
        .log-line.ok     { color:#76e09a; }
        .log-line.fail   { color:#f07070; }
        .log-line.warn   { color:#f5c842; }
        .log-line.try    { color:#7ec8f5; }
        .log-line.info   { color:#c8bfb0; }
        .log-line.detail { color:#8a7f72; }
        .log-line.done   { color:#b08fff;font-weight:bold; }

        /* Verdict card */
        .verdict-card {
            display:flex;align-items:flex-start;gap:14px;
            padding:16px 18px;border-radius:var(--radius-md);
            margin-bottom:12px;
        }
        .verdict-card.valid   { background:rgba(200,255,220,0.5);border:1.5px solid rgba(80,200,120,0.4); }
        .verdict-card.invalid { background:rgba(255,210,205,0.5);border:1.5px solid rgba(230,100,90,0.4); }
        .verdict-card.rate    { background:rgba(255,245,210,0.5);border:1.5px solid rgba(230,180,60,0.4); }
        .verdict-icon { font-size:2rem;line-height:1; }
        .verdict-body h3 { font-size:1rem;font-weight:700;color:var(--stone-900);margin-bottom:4px; }
        .verdict-body p  { font-size:0.82rem;color:var(--stone-700);line-height:1.5; }
        .verdict-body code { font-family:'SF Mono','Cascadia Code',monospace;font-size:0.8rem;background:rgba(0,0,0,0.07);padding:1px 5px;border-radius:4px; }

        /* Auto-check table */
        .auto-results-table { width:100%;border-collapse:collapse;margin-top:10px;font-size:0.8rem; }
        .auto-results-table th,.auto-results-table td { padding:8px 10px;text-align:left;border-bottom:1px solid rgba(200,180,155,0.3); }
        .auto-results-table th { background:rgba(255,255,255,0.45);font-weight:700;color:var(--stone-700);position:sticky;top:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
        .auto-results-table .model-name { font-family:'SF Mono','Cascadia Code',monospace;font-size:0.78rem; }
        .auto-results-table .status-success { color:#2d6b45;font-weight:600; }
        .auto-results-table .status-fail    { color:#8b3a30;font-weight:600; }

        .progress-container { width:100%;background:rgba(200,180,155,0.2);border-radius:10px;margin:10px 0;height:8px;overflow:hidden; }
        .progress-bar { height:100%;width:0%;background:linear-gradient(90deg,#c98d4e,#e8a840);transition:width 0.2s ease;border-radius:10px; }

        .spinner { display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.5);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite; }
        .spinner-dark { border-color:rgba(150,120,80,0.3);border-top-color:var(--stone-700); }
        @keyframes spin { to{transform:rotate(360deg);} }

        /* Modal */
        .modal-overlay { position:fixed;inset:0;background:rgba(40,30,20,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.25s ease-out;padding:20px; }
        .modal-overlay.hidden { display:none; }
        @keyframes fadeIn { from{opacity:0;}to{opacity:1;} }
        .modal { background:var(--glass-bg-strong);backdrop-filter:blur(var(--blur-amount-heavy));-webkit-backdrop-filter:blur(var(--blur-amount-heavy));border:1.5px solid var(--glass-border-strong);border-radius:var(--radius-xl);box-shadow:var(--glass-shadow-lg),0 0 0 1px rgba(255,255,255,0.3) inset;width:100%;max-width:700px;max-height:75vh;display:flex;flex-direction:column;animation:modalSlideIn 0.35s cubic-bezier(0.22,0.61,0.36,1);overflow:hidden; }
        @keyframes modalSlideIn { from{opacity:0;transform:translateY(30px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);} }
        .modal-header { padding:18px 22px;border-bottom:1.5px solid rgba(200,180,155,0.3);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0; }
        .modal-header h3 { font-size:1.1rem;font-weight:700;color:var(--stone-900); }
        .modal-close { width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(180,160,140,0.4);background:rgba(255,255,255,0.5);cursor:pointer;font-size:1.1rem;color:var(--stone-700);display:flex;align-items:center;justify-content:center;transition:all var(--transition-smooth);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
        .modal-close:hover { background:rgba(255,255,255,0.8);border-color:var(--stone-400);color:var(--stone-900);transform:rotate(90deg); }
        .modal-search { padding:14px 22px;border-bottom:1.5px solid rgba(200,180,155,0.2);flex-shrink:0; }
        .modal-search input { width:100%;padding:11px 16px;background:rgba(255,255,255,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(200,180,155,0.4);border-radius:25px;font-size:0.9rem;outline:none;color:var(--stone-900); }
        .modal-search input:focus { border-color:var(--amber-400);box-shadow:0 0 0 4px rgba(200,150,90,0.07);background:rgba(255,255,255,0.7); }
        .modal-body { overflow-y:auto;flex:1;padding:10px 16px 16px; }
        .provider-group { margin-bottom:16px; }
        .provider-header { font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--stone-500);padding:8px 8px 6px;margin-bottom:4px;border-bottom:1px solid rgba(200,180,155,0.2);position:sticky;top:0;background:rgba(250,247,242,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2;border-radius:4px; }
        .model-chips { display:flex;flex-wrap:wrap;gap:7px; }
        .model-chip { padding:8px 14px;border-radius:20px;font-size:0.8rem;cursor:pointer;font-weight:500;transition:all var(--transition-smooth);background:rgba(255,255,255,0.45);border:1.2px solid rgba(200,180,155,0.35);color:var(--stone-700);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap; }
        .model-chip:hover { background:rgba(255,255,255,0.75);border-color:var(--amber-400);color:var(--stone-900);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.07); }
        .model-chip.selected-chip { background:linear-gradient(135deg,#fef3e4,#fde6c8);border-color:var(--amber-400);color:#7d5a2d;font-weight:650;box-shadow:0 2px 10px rgba(200,140,60,0.2); }
        .no-results { text-align:center;padding:30px;color:var(--stone-500);font-style:italic; }
        .toast { position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--glass-bg-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--glass-border-strong);border-radius:25px;padding:12px 24px;font-weight:600;font-size:0.88rem;color:var(--stone-900);box-shadow:var(--glass-shadow-lg);z-index:2000;transition:transform 0.4s cubic-bezier(0.22,0.61,0.36,1);display:flex;align-items:center;gap:8px; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent;border-radius:10px; }
        ::-webkit-scrollbar-thumb { background:rgba(180,155,125,0.4);border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:rgba(160,130,100,0.6); }
        @media(max-width:640px) {
            .main-container { padding:22px 16px 20px;border-radius:var(--radius-lg); }
            .input-row { flex-direction:column;gap:8px; }
            .header h1 { font-size:1.4rem; }
            .btn { width:100%;justify-content:center; }
            .modal { max-height:85vh;border-radius:var(--radius-lg); }
            .model-chip { font-size:0.74rem;padding:6px 10px; }
        }

        /* ── Advanced controls (new from A) ───────────────────── */
        .advanced-toggle {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.82rem; color: var(--stone-700); cursor: pointer;
            margin: 10px 0 6px;
        }
        .advanced-panel {
            display: none;
            padding: 12px 16px;
            background: var(--glass-bg-light);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }
        .advanced-panel.visible { display: block; }
        .param-row {
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;
        }
        .param-label {
            font-size: 0.8rem; font-weight: 600; color: var(--stone-700);
            display: flex; align-items: center; gap: 4px;
        }
        .param-input {
            width: 70px;
            padding: 6px 8px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(6px);
            border: 1.5px solid var(--glass-border);
            border-radius: 6px;
            font-size: 0.85rem; font-family: monospace;
            text-align: center;
            color: var(--stone-900);
        }
        .param-slider { width: 100px; accent-color: var(--amber-500); }
    </style>
</head>
<body>
<div class="decorative-orb orb-1"></div>
<div class="decorative-orb orb-2"></div>
<div class="decorative-orb orb-3"></div>

<div class="main-container">
    <div class="header">
        <div class="icon-row">
            <div class="nvidia-logo">N</div>
            <h1>NVIDIA API Explorer</h1>

    // ── Log helpers ──────────────────────────────────────────────────────────
    function logClass(line) {
        const l = line.trimStart();
        if (l.startsWith('OK'))   return 'ok';
        if (l.startsWith('FAIL')) return 'fail';
        if (l.startsWith('WARN')) return 'warn';
        if (l.startsWith('TRY'))  return 'try';
        if (l.startsWith('INFO')) return 'info';
        if (l.startsWith('DONE')) return 'done';
        return 'detail';
    }

    function buildLogPanel(lines) {
        const panel = document.createElement('div');
        panel.className = 'log-panel';
        lines.forEach(line => {
            const span = document.createElement('span');
            span.className = `log-line ${logClass(line)}`;
            span.textContent = line;
            panel.appendChild(span);
        });
        return panel;
    }

    // New from A: request/response log builder
    function buildRequestLog(url, headers, body, response, timing) {
        const lines = [];
        lines.push('─── Request ───────────────────────────────');
        lines.push(`URL: ${url}`);
        lines.push(`Headers: ${JSON.stringify(headers)}`);
        lines.push(`Body: ${JSON.stringify(body)}`);
        lines.push('');
        lines.push('─── Response ──────────────────────────────');
        lines.push(`Status: ${response.status} ${response.statusText}`);
        const respHeaders = {};
        response.headers.forEach((v,k) => respHeaders[k] = v);
        lines.push(`Headers: ${JSON.stringify(respHeaders)}`);
        lines.push(`Time: ${timing}ms`);
        if (response._body) {
            lines.push(`Body: ${response._body.substring(0, 1000)}`);
        }
        return lines;
    }

    function buildVerdictCard(data) {
        const card = document.createElement('div');
        const isRateLimit = data.status_code === 429;
        if (!data.valid) {
            card.className = 'verdict-card invalid';
            card.innerHTML = `
                <div class="verdict-icon">❌</div>
                <div class="verdict-body">
                    <h3>Key Invalid or Unreachable</h3>
                    <p>${data.error || 'All methods failed.'}</p>
                </div>`;
        } else if (isRateLimit) {
            card.className = 'verdict-card rate';
            card.innerHTML = `
                <div class="verdict-icon">⚠️</div>
                <div class="verdict-body">
                    <h3>Key is VALID — Rate Limited</h3>
                    <p>Method: <code>${data.method}</code> &nbsp;|&nbsp; URL: <code>${data.base_url}</code><br>
                    Wait a few minutes or upgrade your NVIDIA NIM plan.</p>
                </div>`;
        } else {
            card.className = 'verdict-card valid';
            card.innerHTML = `
                <div class="verdict-icon">✅</div>
                <div class="verdict-body">
                    <h3>Key is VALID</h3>
                    <p>Method: <code>${data.method}</code> &nbsp;|&nbsp; ${data.elapsed_ms}ms<br>
                    URL: <code>${data.base_url}</code><br>
                    Model: <code>${data.model}</code><br>
                    Reply: <em>"${(data.reply||'').substring(0,120)}"</em></p>
                </div>`;
        }
        return card;
    }

    // ── CHECK KEY — enhanced with advanced params (A) ────────────────────────
    async function checkApiKey() {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) { showToast('Enter your NVIDIA API key first', '⚠️'); apiKeyInput.focus(); return; }

        hideResponse();
        setStatus('checking', 'Running full fallback chain…');
        responseTime.textContent = '';
        setBtns(true);

        const model = modelInput.value.trim() || undefined;
        const temperature = getTemperature();
        const maxTokens = getMaxTokens();
        const timeout = getTimeout();

        const t0 = performance.now();
        try {
            const res = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: apiKey,
                    model: model || undefined,
                    temperature: temperature,
                    max_tokens: maxTokens,
                    timeout: timeout
                }),
            });
            const data = await res.json();
            const elapsed = Math.round(performance.now() - t0);
            responseTime.textContent = `⏱️ ${elapsed}ms total`;

            if (data.valid && data.status_code !== 429) {
                setStatus('success', '✅ Key is VALID');
                showToast('API key is valid! 🎉', '✅');
            } else if (data.valid && data.status_code === 429) {
                setStatus('warning', '⚠️ Key valid — Rate Limited');
                showToast('Key is valid but rate limited', '⚠️');
            } else {
                setStatus('error', '❌ Key check failed');
                showToast('Key check failed — see log below', '❌');
            }

            const wrap = document.createElement('div');
            wrap.appendChild(buildVerdictCard(data));
            if (data.log && data.log.length) wrap.appendChild(buildLogPanel(data.log));
            showResponse(
                `<strong>Method:</strong> ${data.method||'—'} &bull; <strong>URL:</strong> ${data.base_url||'—'} &bull; <strong>Model:</strong> ${data.model||'—'}`,
                wrap
            );
        } catch (err) {
            const elapsed = Math.round(performance.now() - t0);
            responseTime.textContent = `⏱️ ${elapsed}ms`;
            setStatus('error', '❌ Network error reaching /api/check');
            showToast('Could not reach backend', '❌');
            showResponse('<strong>Network Error</strong>', `Could not reach /api/check\n${err.message}\n\nMake sure the app is deployed on Vercel (not opened as a local HTML file).`);
        } finally {
            setBtns(false);
        }
    }

    // ── SEND PROMPT — with full logging and advanced params (A) ──────────────
    async function callNvidiaAPI(apiKey, model, messages, maxTokens, temperature, timeoutSec) {
        const urls = [
            'https://api.nvidia.com/v1/chat/completions',
            'https://integrate.api.nvidia.com/v1/chat/completions',
        ];
        let lastErr;
        for (const url of urls) {
            const headers = {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
            };
            const body = {
                model, messages,
                max_tokens: maxTokens,
                temperature: temperature,
            };
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutSec * 1000);
            const t0 = performance.now();
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(body),
                    signal: controller.signal,
                });
                const data = await res.json();
                const elapsed = Math.round(performance.now() - t0);
                clearTimeout(timeoutId);
                if (!res.ok) {
                    const msg = data.error?.message || data.message || `HTTP ${res.status}`;
                    const logLines = buildRequestLog(url, headers, body, {
                        status: res.status,
                        statusText: msg,
                        headers: res.headers,
                        _body: JSON.stringify(data)
                    }, elapsed);
                    throw { message: msg, log: logLines };
                }
                const logLines = buildRequestLog(url, headers, body, {
                    status: res.status,
                    statusText: 'OK',
                    headers: res.headers,
                    _body: JSON.stringify(data)
                }, elapsed);
                return { data, log: logLines };
            } catch(e) {
                clearTimeout(timeoutId);
                lastErr = e;
            }
        }
        throw lastErr;
    }

    async function sendPrompt() {
        const apiKey = apiKeyInput.value.trim();
        const model  = modelInput.value.trim();
        const prompt = promptInput.value.trim();
        if (!apiKey) { showToast('Enter your NVIDIA API key', '⚠️'); apiKeyInput.focus(); return; }
        if (!model)  { showToast('Enter or select a model', '⚠️'); modelInput.focus(); return; }
        if (!prompt) { showToast('Enter a prompt', '⚠️'); promptInput.focus(); return; }

        hideResponse();
        setStatus('checking', 'Sending prompt…');
        setBtns(true);
        const t0 = performance.now();
        try {
            const temp = getTemperature();
            const maxTok = getMaxTokens();
            const timeout = getTimeout();
            const result = await callNvidiaAPI(apiKey, model, [{ role:'user', content:prompt }], maxTok, temp, timeout);
            const elapsed = Math.round(performance.now() - t0);
            setStatus('success', '✅ Response received');
            responseTime.textContent = `⏱️ ${elapsed}ms`;
            const data = result.data;
            const content = data.choices?.[0]?.message?.content || '(No content)';
            const tokIn = data.usage?.prompt_tokens || '?';
            const tokOut = data.usage?.completion_tokens || '?';
            const modelUsed = data.model || model;

            const wrap = document.createElement('div');
            wrap.innerHTML = `<p>${content}</p>`;
            wrap.appendChild(buildLogPanel(result.log));
            showResponse(
                `<strong>Model:</strong> <code>${modelUsed}</code> &bull; <strong>Tokens:</strong> ${tokIn} in / ${tokOut} out &bull; ${elapsed}ms`,
                wrap
            );
            showToast('Response received!', '🚀');
        } catch(err) {
            const elapsed = Math.round(performance.now() - t0);
            responseTime.textContent = `⏱️ ${elapsed}ms`;
            setStatus('error', '❌ Request failed');
            const wrap = document.createElement('div');
            wrap.innerHTML = `<p style="color:#e05545;">Error: ${err.message || err}</p>`;
            if (err.log) wrap.appendChild(buildLogPanel(err.log));
            showResponse('<strong>❌ Request Failed</strong>', wrap);
            showToast('Request failed', '❌');
        } finally {
            setBtns(false);
        }
    }

    // ── AUTO-CHECK (uses advanced settings) ─────────────────────────────────
    function getModelsToCheck() {
        return nvidiaOnly.checked ? modelCatalog.filter(m => m.provider === 'NVIDIA') : [...modelCatalog];
    }
    function updateModelCountLabel() {
        const c = getModelsToCheck().length;
        modelCountLabel.textContent = `${c} model${c!==1?'s':''} for auto‑check`;
    }
    nvidiaOnly.addEventListener('change', updateModelCountLabel);

    async function startAutoCheck() {
        if (isAutoChecking) return;
        const apiKey = apiKeyInput.value.trim();
        const prompt = promptInput.value.trim() || 'Hello, this is a test.';
        if (!apiKey) { showToast('Enter your NVIDIA API key', '⚠️'); apiKeyInput.focus(); return; }
        const models = getModelsToCheck();
        if (!models.length) { showToast('No models selected', '⚠️'); return; }

        isAutoChecking = true;
        autoCheckAbortController = new AbortController();
        const signal = autoCheckAbortController.signal;
        const temperature = getTemperature();
        const maxTokens = getMaxTokens();
        const timeout = getTimeout();

        setBtns(true);
        stopAutoBtn.style.display = 'inline-flex';
        progressContainer.style.display = 'block';
        progressText.style.display = 'block';
        hideResponse();
        setStatus('checking', `Auto‑checking ${models.length} models…`);

        let completed = 0, results = [];
        const total = models.length;

        function updateProgress() {
            const pct = Math.round((completed / total) * 100);
            progressBar.style.width = pct + '%';
            progressText.textContent = `${completed} / ${total} (${pct}%)`;
        }
        updateProgress();

        const wrap = document.createElement('div');
        wrap.innerHTML = '<strong>Auto‑Check Results</strong><br><small>Model, status, and response time.</small>';
        const table = document.createElement('table');
        table.className = 'auto-results-table';
        table.innerHTML = `<thead><tr><th>Model</th><th>Status</th><th>ms</th><th>Note</th></tr></thead><tbody></tbody>`;
        wrap.appendChild(table);
        showResponse('', wrap);

        for (const m of models) {
            if (signal.aborted) break;
            const t0 = performance.now();
            let status = 'pending', note = '';
            try {
                await callNvidiaAPI(apiKey, m.name, [{ role:'user', content:prompt }], maxTokens, temperature, timeout);
                status = 'success';
            } catch(e) {
                status = 'fail';
                note = e.message?.substring(0,60) || 'Error';
            }
            const ms = Math.round(performance.now() - t0);
            results.push({ model:m.name, status, ms, note });
            completed++;
            updateProgress();
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="model-name">${m.name}</td>
                <td class="${status==='success'?'status-success':'status-fail'}">${status==='success'?'✅ OK':'❌ Fail'}</td>
                <td>${ms}</td>
                <td style="font-size:0.7rem;color:var(--stone-500);">${note||'—'}</td>`;
            table.querySelector('tbody').appendChild(tr);
            responseArea.scrollTop = responseArea.scrollHeight;
        }

        const ok = results.filter(r => r.status==='success').length;
        if (signal.aborted) {
            setStatus('error', 'Auto‑check stopped');
            showToast('Stopped', '⏹️');
        } else {
            setStatus(ok>0?'success':'error', `Auto‑check done: ${ok}/${results.length} succeeded`);
            showToast(`${ok} working models`, ok>0?'✅':'❌');
        }
        isAutoChecking = false;
        autoCheckAbortController = null;
        stopAutoBtn.style.display = 'none';
        progressContainer.style.display = 'none';
        progressText.style.display = 'none';
        setBtns(false);
    }

    function stopAutoCheck() {
        if (autoCheckAbortController) autoCheckAbortController.abort();
    }

    function setBtns(disabled) {
        checkKeyBtn.disabled = disabled;
        sendPromptBtn.disabled = disabled;
        autoCheckBtn.disabled = disabled;
    }

    function clearAll() {
        apiKeyInput.value = '';
        modelInput.value = 'meta/llama-3.1-8b-instruct';
        promptInput.value = '';
        hideResponse();
        hideStatus();
        currentSelectedModel = 'meta/llama-3.1-8b-instruct';
        stopAutoCheck();
        progressContainer.style.display = 'none';
        progressText.style.display = 'none';
        showToast('Cleared', '🗑️');
    }

    // ── Modal (unchanged) ────────────────────────────────────────────────────
    function renderModelList(filter='') {
        const fl = filter.toLowerCase().trim();
        const filtered = fl ? modelCatalog.filter(m => m.name.toLowerCase().includes(fl) || m.provider.toLowerCase().includes(fl)) : modelCatalog;
        const grouped = {};
        filtered.forEach(m => { (grouped[m.provider] = grouped[m.provider]||[]).push(m); });
        const providers = Object.keys(grouped).sort((a,b) => a==='NVIDIA'?-1:b==='NVIDIA'?1:a.localeCompare(b));
        let html = '';
        providers.forEach(p => {
            html += `<div class="provider-group"><div class="provider-header">${p} <span style="font-weight:400;font-size:0.7rem;">(${grouped[p].length})</span></div><div class="model-chips">`;
            grouped[p].forEach(m => {
                const sel = currentSelectedModel === m.name;
                html += `<span class="model-chip${sel?' selected-chip':''}" data-model="${m.name.replace(/"/g,'&quot;')}">${m.name}</span>`;
            });
            html += `</div></div>`;
        });
        if (!html) html = `<div class="no-results">😕 No models matching "<strong>${filter}</strong>"</div>`;
        modalBody.innerHTML = html;
        modalBody.querySelectorAll('.model-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const name = chip.getAttribute('data-model');
                modelInput.value = name;
                currentSelectedModel = name;
                closeModal();
                showToast(`Model: ${name}`, '🤖');
            });
        });
    }
    function openModal() {
        modalOverlay.classList.remove('hidden');
        modalSearchInput.value = '';
        currentSelectedModel = modelInput.value.trim() || null;
        renderModelList('');
        modalSearchInput.focus();
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        modalOverlay.classList.add('hidden');
        document.body.style.overflow = '';
    }

    // ── Event listeners ───────────────────────────────────────────────────────
    checkKeyBtn.addEventListener('click', checkApiKey);
    sendPromptBtn.addEventListener('click', sendPrompt);
    autoCheckBtn.addEventListener('click', startAutoCheck);
    stopAutoBtn.addEventListener('click', stopAutoCheck);
    clearBtn.addEventListener('click', clearAll);
    showModelsBtn.addEventListener('click', openModal);
    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    modalSearchInput.addEventListener('input', () => renderModelList(modalSearchInput.value));

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) { closeModal(); return; }
        if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); sendPrompt(); }
        if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === 'K') { e.preventDefault(); checkApiKey(); }
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    modelInput.value = 'meta/llama-3.1-8b-instruct';
    currentSelectedModel = 'meta/llama-3.1-8b-instruct';
    updateModelCountLabel();
    console.log('%c🟢 NVIDIA API Explorer Ready','font-weight:bold;color:#76b900;');
})();
</script>
